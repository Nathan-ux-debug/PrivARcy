[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privarcy"
version = "2.0.0"
description = "Local-first privacy redaction for recorded video and live cameras (faces, ID/payment cards, screens, plates, text)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "ultralytics>=8.1",
    "aiohttp>=3.9",
    "aiortc>=1.9",
    "cryptography>=42",
    "qrcode[pil]>=7.4",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
ocr = ["transformers>=4.38", "torch>=2.1"]
windows-camera-names = ["pygrabber>=0.2"]
dev = ["pytest>=8", "pytest-cov>=5", "scikit-image>=0.22", "ruff>=0.4"]

[project.scripts]
privarcy = "privarcy.app.main:main"

[project.gui-scripts]
privarcy-gui = "privarcy.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"privarcy.app" = ["assets/*"]
"privarcy.capture.phone_pairing" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = ["slow: end-to-end tests that process real video"]

[tool.ruff]
line-length = 130
target-version = "py310"
